name: Verify Honeycomb
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.98.0
      - run: python3 scripts/verify_vendored_iam.py
      - run: cargo +1.98.0 fmt --all --check
      - run: cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.98.0 test --workspace --locked
      - run: cargo +1.98.0 package --workspace --exclude silicon-honeycomb-server --locked
      - run: cargo +1.98.0 build --workspace --examples --bins --locked
      - run: python3 docs-site/scripts/generate_reference.py --check
      - run: python3 docs-site/scripts/check_examples.py
      - run: python3 scripts/test_adopt_legacy_app.py
      - run: python3 scripts/test_cli.py
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_cargo_install.py
      - run: bash -n install.sh
  websites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup default 1.98.0
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: cargo +1.98.0 build -p silicon-honeycomb-cli --locked
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: web/test-results

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - run: npx playwright install --with-deps chromium
        working-directory: docs-site
      - run: npm test
        working-directory: docs-site
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: documentation-browser-failures
          path: docs-site/test-results
