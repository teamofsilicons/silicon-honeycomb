name: Build CLI release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
          - runner: windows-2025
            target: windows-x86_64
          - runner: windows-11-arm
            target: windows-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo +1.98.0 test --workspace --locked
      - run: cargo +1.98.0 build -p silicon-honeycomb-cli --release --locked
      - run: python scripts/release_asset.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: honeycomb-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
  collect:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: honeycomb-*
          merge-multiple: true
          path: release-assets
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: honeycomb-release-candidate
          path: release-assets/*
# Candidate artifacts only. Publication is a separate operator action after review.
