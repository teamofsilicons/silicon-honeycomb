[workspace]
members = ["crates/core", "crates/server", "crates/client", "crates/cli"]
exclude = ["vendor/silicon-iam-client"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/teamofsilicons/silicon-honeycomb"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
url = { version = "2", features = ["serde"] }
tempfile = "3"
honeycomb-core = { package = "silicon-honeycomb-core", path = "crates/core", version = "0.4.1" }
honeycomb-client = { package = "silicon-honeycomb-client", path = "crates/client", version = "0.4.1" }

[profile.release]
lto = "thin"
strip = true
