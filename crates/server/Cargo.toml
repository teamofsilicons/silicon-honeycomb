[package]
name = "silicon-honeycomb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
honeycomb-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
uuid.workspace = true
url.workspace = true
semver.workspace = true
tempfile.workspace = true
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "limit"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
silicon-iam-client = { version = "=1.11.0", path = "../../vendor/silicon-iam-client" }
secrecy = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
honeycomb-client.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
space-station = "=0.1.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
